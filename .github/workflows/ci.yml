name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check that go.mod and go.sum are tidy
        if: matrix.os == 'ubuntu-latest'
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o "prt${{ runner.os == 'Windows' && '.exe' || '' }}" ./cmd/prt

      - name: Run the binary
        run: |
          ./prt --version
          ./prt --help

  snapshot:
    name: Snapshot build (six targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean

      - name: Check that all six targets were built
        run: |
          ls -l dist
          count="$(ls dist/*.tar.gz dist/*.zip | wc -l)"
          if [ "$count" -ne 6 ]; then
            echo "Expected 6 archives, found $count"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: prt-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 14
          if-no-files-found: error
